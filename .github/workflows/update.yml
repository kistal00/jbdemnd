name: Update job data

on:
  schedule:
    - cron: "15 22 * * *"   # 22:15 UTC = 04:00 Nepal time, once a day
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch DoFE jobs
        continue-on-error: true      # a failure here must not block the seasonal step
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python fetch_jobs.py
      - name: Build seasonal jobs
        continue-on-error: true      # ...and vice versa
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python build_seasonal.py
      - name: Commit data
        run: |
          git config user.name "job-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update job data"
          git push
